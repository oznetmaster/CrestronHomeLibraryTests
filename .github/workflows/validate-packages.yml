name: Validate processor packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - KasaClient.ProcessorTests
          - TeslaPowerwallLibrary.ProcessorTests
          - AppleTVControlLibrary.ProcessorTests
          - OverkizClient.ProcessorTests
          - WiserHeatAPIv2.ProcessorTests
          - SimpleWeather.ProcessorTests
          - WeatherLinkLiveLibrary.ProcessorTests
          - RainPointClient.ProcessorTests
          - EaseeChargerClient.ProcessorTests
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: NuGet/setup-nuget@v2
      - name: Fetch pinned sources and packaging tools
        run: |
          ./Initialize-Sources.ps1
          ./sources/CrestronHomeNUnit/tools/InstallCiTools.ps1
      - name: Build and validate without publishing
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: validate-packages-validate-build-and-validate-without-publishing
        env:
          TEST_PACKAGE: ${{ matrix.package }}
      - name: Retain packaged-test validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.package }}
          path: |
            artifacts/test-results/**
            artifacts/validation/**
            artifacts/execution-validation/**
          if-no-files-found: warn
