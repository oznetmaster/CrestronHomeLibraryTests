name: Workflow discovery
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: workflows/KasaClient.WorkflowTests/KasaClient.WorkflowTests.csproj
            expected: KasaClient processor workflow
          - project: workflows/TeslaPowerwallLibrary.WorkflowTests/TeslaPowerwallLibrary.WorkflowTests.csproj
            expected: TeslaPowerwallLibrary processor workflow
          - project: workflows/AppleTVControlLibrary.WorkflowTests/AppleTVControlLibrary.WorkflowTests.csproj
            expected: AppleTVControlLibrary processor workflow
          - project: workflows/OverkizClient.WorkflowTests/OverkizClient.WorkflowTests.csproj
            expected: OverkizClient processor workflow
          - project: workflows/WiserHeatAPIv2.WorkflowTests/WiserHeatAPIv2.WorkflowTests.csproj
            expected: WiserHeatAPIv2 processor workflow
          - project: workflows/SimpleWeather.WorkflowTests/SimpleWeather.WorkflowTests.csproj
            expected: SimpleWeather processor workflow
          - project: workflows/WeatherLinkLiveLibrary.WorkflowTests/WeatherLinkLiveLibrary.WorkflowTests.csproj
            expected: WeatherLinkLiveLibrary processor workflow
          - project: workflows/RainPointClient.WorkflowTests/RainPointClient.WorkflowTests.csproj
            expected: RainPointClient processor workflow
          - project: workflows/EaseeChargerClient.WorkflowTests/EaseeChargerClient.WorkflowTests.csproj
            expected: EaseeChargerClient processor workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify offline Test Explorer discovery
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: workflow-discovery-discover-verify-offline-test-explorer-discovery
        env:
          WORKFLOW_PROJECT: ${{ matrix.project }}
          EXPECTED_WORKFLOW: ${{ matrix.expected }}
