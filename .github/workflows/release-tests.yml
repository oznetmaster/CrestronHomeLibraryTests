name: Release processor tests

on:
  workflow_dispatch:
    inputs:
      version:
        description: Independent test-package version (major.minor.patch)
        required: true
        type: string
      package:
        description: Processor test package
        required: true
        type: choice
        options:
          - KasaClient.ProcessorTests
          - TeslaPowerwallLibrary.ProcessorTests
          - AppleTVControlLibrary.ProcessorTests
          - OverkizClient.ProcessorTests
          - WiserHeatAPIv2.ProcessorTests
          - SimpleWeather.ProcessorTests
          - WeatherLinkLiveLibrary.ProcessorTests
      skip_hardware_checks:
        description: Publish without hardware validation when the processor or local runner is unavailable
        required: false
        type: boolean
        default: false
      hardware_skip_reason:
        description: Reason for skipping hardware checks (required when selected)
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: write

concurrency:
  group: processor-test-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_VERSION: ${{ inputs.version }}
      TEST_PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify configured release checks
        shell: pwsh
        working-directory: ${{ github.workspace }}/.
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RELEASE_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          REQUIRED_HOSTED_WORKFLOWS: '["validate-packages.yml","workflow-discovery.yml"]'
          RELEASE_SKIP_HARDWARE_CHECKS: ${{ inputs.skip_hardware_checks }}
          RELEASE_HARDWARE_SKIP_REASON: ${{ inputs.hardware_skip_reason }}
        run: '& ./.github/scripts/Wait-RequiredReleaseChecks.ps1'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: NuGet/setup-nuget@v2
      - name: Fetch pinned sources
        shell: pwsh
        run: |
          ./Initialize-Sources.ps1
          "PROCESSOR_SDK=$env:GITHUB_WORKSPACE/sources/CrestronHomeNUnit" >> $env:GITHUB_ENV
      - name: Prepare test-package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Run test releases from main.' }
          if ($env:TEST_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Use major.minor.patch.' }
          $config = ./Get-ReleasePackage.ps1 -Package $env:TEST_PACKAGE
          "TEST_DISPLAY_NAME=$($config.displayName)" >> $env:GITHUB_ENV
          $tag = "$env:TEST_PACKAGE-v$env:TEST_VERSION"
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists." }
          $directory = "$env:GITHUB_WORKSPACE/packages/$env:TEST_PACKAGE"
          $manifest = "$directory/$env:TEST_PACKAGE.json"
          $project = "$directory/$env:TEST_PACKAGE.csproj"
          & "$env:PROCESSOR_SDK/CrestronHomeNUnit.Driver/BumpDriverVersion.ps1" -ManifestPath $manifest -Configuration Release -ReleaseVersion $env:TEST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Test-package version preparation failed.' }
          $text = [IO.File]::ReadAllText($project)
          $text = [regex]::Replace($text, '<Version>[^<]+</Version>', '<Version>' + $env:TEST_VERSION + '</Version>')
          [IO.File]::WriteAllText($project, $text)
          $changelog = Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md'
          $existing = [IO.File]::ReadAllText($changelog)
          $entry = "## $env:TEST_PACKAGE v$env:TEST_VERSION - $([DateTime]::UtcNow.ToString('yyyy-MM-dd'))`n`nPublished processor test package on GitHub. This is a test-package release only; no driver or library NuGet package is published. See the matching package release notes for changes and validation.`n`n"
          $firstBreak = $existing.IndexOf("`n")
          if ($firstBreak -lt 0) { throw 'Invalid changelog header.' }
          [IO.File]::WriteAllText($changelog, $existing.Substring(0, $firstBreak + 1) + "`n" + $entry + $existing.Substring($firstBreak + 1).TrimStart())
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $manifest $project $changelog
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "Release $tag"
            if ($LASTEXITCODE -ne 0) { throw 'Release commit failed.' }
          } elseif ($LASTEXITCODE -ne 0) { throw 'Cannot inspect staged release version.' }
          "TEST_TAG=$tag" >> $env:GITHUB_ENV
          "TEST_PROJECT_DIRECTORY=$directory" >> $env:GITHUB_ENV
      - name: Install packaging tools
        shell: pwsh
        run: '& "$env:PROCESSOR_SDK/tools/InstallCiTools.ps1"'
      - name: Build and validate test release
        shell: pwsh
        run: ./Build-TestRelease.ps1 -Version $env:TEST_VERSION -Package $env:TEST_PACKAGE -SdkRoot $env:PROCESSOR_SDK -ManifestUtilExe $env:MANIFEST_UTIL_EXE
      - uses: actions/upload-artifact@v4
        with:
          name: processor-tests-${{ inputs.version }}
          path: artifacts/release/*
          if-no-files-found: error
      - name: Push test version and annotated tag
        shell: pwsh
        run: |
          git tag -a $env:TEST_TAG -m "$env:TEST_DISPLAY_NAME $env:TEST_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Test tag creation failed.' }
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$env:TEST_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release push failed; main may have advanced.' }
      - name: Publish test package on GitHub
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem artifacts/release -File | Select-Object -ExpandProperty FullName)
          gh release create $env:TEST_TAG @assets --verify-tag --title "$env:TEST_DISPLAY_NAME v$env:TEST_VERSION" --notes-file "$env:TEST_PROJECT_DIRECTORY/RELEASE-NOTES.md"
          if ($LASTEXITCODE -ne 0) { throw 'Test release creation failed.' }